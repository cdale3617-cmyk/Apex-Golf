name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Test caddie decisions and shared round state
        run: npm test

      - name: Check the code and build the web app
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Allow location, microphone and internet
        run: python3 scripts/patch_manifest.py

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Golf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk APEX-Golf.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" APEX-Golf.apk --title "APEX Golf — caddie build ${GITHUB_RUN_NUMBER}" --notes "Shared shot state, GPS ball position, draggable target and mapped hazard checks. Download APEX-Golf.apk. Confirm GPS and speech on your phone before course use." --target "$GITHUB_SHA" --latest
